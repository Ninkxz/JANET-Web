<!DOCTYPE html>

  <script>
    /* DEV-ONLY harness: skip the launch gate and mock window.fetch so the shell +

       operators (served only when you open /_devtest.html by hand). */
    try { sessionStorage.setItem('janet2_session', '1'); sessionStorage.setItem('janet2_ack', 'yes'); } catch (e) {}

    (function () {
      var REGISTRY = {
        suite: 'J.A.N.E.T. TWO',
        tools: [
          { id: '_stub', name: 'Kit Test (dev)', category: 'Dev', icon: '🧪', ported: true, summary: 'Phase 0b verification view - exercises every shared component on a mocked job stream.' },
          { id: 'message', name: 'Remote Message', category: 'Operations', icon: 'E8BD', ported: true, summary: 'Broadcast a popup to logged-on users across many hosts in parallel.' },
          { id: 'secureboot', name: 'Secure Boot Enabler', category: 'Hardening', icon: 'E72E', ported: true, summary: 'Enable UEFI Secure Boot on Dell/HP/Lenovo via SYSTEM scheduled task (CIM/DCOM).' },
          { id: 'dhcp', name: 'DHCP Scope Options', category: 'Network', icon: 'E703', ported: true, beta: true, summary: 'Read and set DHCP scope options across servers/scopes.' },
          { id: 'winupgrade', name: 'Windows Upgrade', category: 'Remediation', icon: 'E898', ported: true, summary: 'Pin/unpin the Windows feature-update target version and push feature-update CAB/MSU packages (DISM) across many workstations.' },
          { id: 'wpt', name: 'Workstation Patching', category: 'Remediation', icon: 'E895', ported: true, summary: 'The core remediation engine.' },
          { id: 'acas', name: 'ACAS Nemesis', category: 'Remediation', icon: 'EA18', ported: true, summary: 'Remediate ACAS/Tenable findings.' },
          { id: 'restart', name: 'Restart Scheduler', category: 'Lifecycle', icon: 'E7E8', ported: true, summary: 'Coordinated fleet reboots.' },
          { id: 'reports', name: 'Reports', category: 'Reporting', icon: 'E9D9', ported: true, summary: 'Build and export fleet / compliance reports.' }
        ]
      };
      var CRED = { set: false, user: 'AFNET\\\\you', mode: 'current Kerberos (CAC)' };
      var jobs = {}, seq = 0;

      function hostsOf(params) {
        var hosts = String((params && params.targets) || '').split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean);
        return hosts.length ? hosts : ['host01'];
      }
      function buildEvents(tool, action, params) {
        var hosts = hostsOf(params);
        if (tool === 'reports') {
          if (action === 'acas-parse-file' || action === 'acas-load-report') {
            var loaded = action === 'acas-load-report';
            var data = [
              ['PC-1', '12345', 'OpenSSL < 3.0 Multiple Vulns', 'Critical', 'CVE-2024-1', 'Patchable'],
              ['PC-1', '67890', 'Chrome < 120', 'High', 'CVE-2024-2', 'Patchable'],
              ['PC-2', '12345', 'OpenSSL < 3.0 Multiple Vulns', 'Critical', 'CVE-2024-1', 'NOT OUR PATCH'],
              ['PC-3', '55555', 'Unsupported OS', 'Critical', '', 'NOT OUR PATCH']
            ];
            var rev = [{ type: 'status', text: (loaded ? 'Loading saved report...' : 'Parsing ACAS file...') }];
            data.forEach(function (d, i) { rev.push({ type: 'progress', done: i + 1, total: data.length }); rev.push({ type: 'row', Host: d[0], Hostname: d[0], PluginID: d[1], VulnName: d[2], Severity: d[3], CVE: d[4], Category: d[5] }); });
            rev.push({ type: 'final', result: { summary: { total: data.length, loaded: data.length, hosts: 3, file: 'saved_report.json' } } });
            return rev;
          }
          var rgen = [{ type: 'status', text: action + ' running...' }, { type: 'row', File: 'ReportsTool_out' }, { type: 'final', result: { summary: { ok: true, path: 'C:\\Temp\\out.html', file: 'out' } } }];
          return rgen;
        }
        if (tool === 'restart') {
          if (action === 'dispatch-restart') {
            var dh = hosts, sent = 0;
            var dev = [{ type: 'status', text: 'Dispatch armed: ' + dh.length + ' host(s)...' }];
            dh.forEach(function (h, i) {
              dev.push({ type: 'progress', done: i + 1, total: dh.length });
              var roll = i % 5;
              var st = roll === 4 ? 'Failed' : roll === 3 ? 'Declined' : 'Dispatched';
              if (st === 'Dispatched') sent++;
              dev.push({ type: 'row', Host: h, Status: st, RestartAt: (params && params.restartTime) || '', ConsentState: (params && params.requireConsent) ? (st === 'Declined' ? 'Declined' : 'Approved') : 'n/a', Result: st === 'Dispatched' ? 'OK (rc=0)' : st === 'Declined' ? 'Declined by user' : 'rc=1 (WinRM)' });
            });
            dev.push({ type: 'final', result: { summary: { total: dh.length, sent: sent, declined: dh.filter(function (h, i) { return i % 5 === 3; }).length, failed: dh.filter(function (h, i) { return i % 5 === 4; }).length, skipped: 0 } } });
            return dev;
          }
          if (action === 'verify-reboots') {
            var vh = hosts;
            var vev = [{ type: 'status', text: 'Monitoring ' + vh.length + ' host(s)...' }], reb = 0;
            vh.forEach(function (h, i) { vev.push({ type: 'progress', done: i + 1, total: vh.length }); var ok = (i % 3 !== 2); if (ok) reb++; vev.push({ type: 'row', Host: h, State: ok ? 'Rebooted - confirmed' : 'No contact - no reply', 'Went-Down': ok ? '12:01' : '', 'Came-Back': ok ? '12:04' : '', 'Last-Ping': '12:05' }); });
            vev.push({ type: 'final', result: { summary: { total: vh.length, rebooted: reb, notConfirmed: vh.length - reb } } });
            return vev;

          if (action === 'abort-scheduled') {
            var ah = hosts, ae = [{ type: 'status', text: 'Aborting ' + ah.length + '...' }];

          }
          if (action === 'test-single-host') {

        if (tool === 'acas') {
          if (action === 'import-acas') {
            var iev = [{ type: 'status', text: 'Parsing ACAS CSV...' }];
            ['PC-1', 'PC-2', 'PC-3', 'PC-4'].forEach(function (h, i) { iev.push({ type: 'progress', done: i + 1, total: 4 }); iev.push({ type: 'row', Host: h, 'Findings Added': 3 + i, 'Severity (max)': (i % 2 ? 'High' : 'Critical'), Plugins: 2 + i, 'Servers Skipped': 0 }); });
            iev.push({ type: 'final', result: { summary: { findings: 14, total: 4, serversSkipped: 1 } } });

          if (action === 'analyze-remediation') {

              { key: 'plg:defender', plugin: 'Windows Defender - Out of Date Definitions', category: 'Patchable', severity: 'High', hostCount: 3, hosts: ['PC-1', 'PC-2', 'PC-3'], profiles: ['Windows Defender - Update Definitions'], runnable: true, members: 1, memberNames: [], cves: ['CVE-2024-0001'], solution: 'Update Defender definitions.' },
              { key: 'plg:chrome', plugin: 'Google Chrome < 120 Multiple Vulnerabilities', category: 'Patchable', severity: 'Critical', hostCount: 2, hosts: ['PC-2', 'PC-4'], profiles: ['Google Chrome - Update', 'Google Chrome - Enterprise MSI'], runnable: true, members: 2, memberNames: ['Chrome RCE', 'Chrome UAF'], cves: ['CVE-2024-0002', 'CVE-2024-0003'], solution: 'Update Chrome.' },
              { key: 'plg:eol', plugin: 'Unsupported Windows OS', category: 'Unpatchable', severity: 'Critical', hostCount: 1, hosts: ['PC-1'], profiles: [], runnable: false, members: 1, memberNames: [], cves: [], solution: 'Replace the OS.' }

            return [{ type: 'status', text: 'Analyzing...' }, { type: 'progress', done: 3, total: 3 },
              { type: 'final', result: { groups: groups, summary: { total: 3, patchable: 2, experimental: 0, reboot: 0, unpatchable: 1, notUpdatable: 0, findings: 14, uniqueHosts: 4, autoRunnableHosts: 4 } } }];

          if (action === 'run-vulnerability') {
            var hv = hosts, okv = 0;

            hv.forEach(function (h, i) { rv.push({ type: 'progress', done: i + 1, total: hv.length }); var ok = (i % 4 !== 3); if (ok) okv++; rv.push({ type: 'row', Host: h, Result: ok ? 'OK' : 'FAIL', 'Version Before': '1.0', 'Version After': ok ? '1.1' : '1.0', Mode: (params && params.verifyOnly) ? 'verify' : 'patch', Timestamp: '12:00:00', Detail: ok ? 'updated' : 'WinRM unreachable' }); });
            rv.push({ type: 'final', result: { summary: { total: hv.length, ok: okv, failed: hv.length - okv } } });
            return rv;
          }
          if (action === 'run-all-parallel' || action === 'run-all-sequential') {
            var jobLines = String((params && params.jobs) || '').split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean);
            var pairs = []; jobLines.forEach(function (line) { var pp = line.split('|'); var prof = (pp[0] || '').trim(); ((pp[1] || '').split(/[,;\s]+/)).map(function (s) { return s.trim(); }).filter(Boolean).forEach(function (h) { pairs.push({ prof: prof, h: h }); }); });
            var rae = [{ type: 'status', text: action.toUpperCase() + ': ' + jobLines.length + ' profile group(s), ' + pairs.length + ' (profile,host)...' }], okA = 0;
            pairs.forEach(function (pr, i) { rae.push({ type: 'progress', done: i + 1, total: pairs.length }); var ok = (i % 5 !== 4); if (ok) okA++; rae.push({ type: 'row', Host: pr.h, Profile: pr.prof, Result: ok ? 'OK' : 'FAIL', 'Version Before': '1.0', 'Version After': ok ? '1.1' : '1.0', Timestamp: '12:00:00', Detail: ok ? 'updated' : 'fail' }); });
            rae.push({ type: 'final', result: { summary: { total: pairs.length, ok: okA, failed: pairs.length - okA } } });
            return rae;
          }
          if (action === 'kb-scan-findings') {
            var kbf = [{ type: 'status', text: 'Scanning KB findings...' }];
            var data = [['PC-1', 'KB5060999', 'Critical', 'Windows Cumulative Update', 'CVE-2024-0011'], ['PC-1', 'KB5062552', 'High', '.NET Update', 'CVE-2024-0012'], ['PC-2', 'KB5060999', 'Critical', 'Windows Cumulative Update', 'CVE-2024-0011'], ['PC-3', 'KB5061111', 'Medium', 'Edge Update', 'CVE-2024-0013']];
            data.forEach(function (d, i) { kbf.push({ type: 'progress', done: i + 1, total: data.length }); kbf.push({ type: 'row', _rk: d[0] + '|' + d[1], Host: d[0], KB: d[1], Severity: d[2], Plugin: d[3], CVE: d[4] }); });
            kbf.push({ type: 'final', result: { summary: { total: data.length, hosts: 3 } } });
            return kbf;
          }
          if (action === 'kb-install') {
            var plines = String((params && params.pairs) || '').split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean);
            var meth = /uso/i.test((params && params.method) || '') ? 'usoclient' : 'mecm';
            var kbi = [{ type: 'status', text: 'KB install (' + meth + ') on ' + plines.length + ' host(s)...' }], okI = 0;
            plines.forEach(function (line, i) {
              var pp = line.split('|'); var h = (pp[0] || '').trim(); var kbs = (pp[1] || '').trim();
              kbi.push({ type: 'progress', done: i + 1, total: plines.length });
              var ok = (i % 4 !== 3); if (ok) okI++;
              kbi.push({ type: 'row', Host: h, KBs: kbs, MECM: ok ? 1 : 0, MSU: 0, Skipped: 0, Result: ok ? 'OK' : 'FAIL', Detail: ok ? (meth === 'usoclient' ? 'UsoClient triggered' : 'MECM: triggered 1 update(s)') : 'MECM query failed' });
            });
            kbi.push({ type: 'final', result: { summary: { total: plines.length, ok: okI, failed: plines.length - okI, skipped: 0, method: meth } } });
            return kbi;
          }
          if (action === 'auto-patch' || action === 'preflight-services') {
            var ap = [{ type: 'status', text: action + ' running...' }];
            (hosts.length ? hosts : ['PC-1', 'PC-2']).forEach(function (h, i) { ap.push({ type: 'progress', done: i + 1, total: 2 }); ap.push({ type: 'row', Host: h, Profile: 'auto', Result: 'OK', 'Changes Made': 'winrm', Detail: 'ok' }); });
            ap.push({ type: 'final', result: { summary: { total: 2, ok: 2, failed: 0 } } });
            return ap;
          }
        }
        if (tool === 'wpt') {
          if (action === 'reboot-schedule') {
            window.__wptPing = 0;   // reset the post-reboot monitor simulation
            var rs = [{ type: 'status', text: 'Scheduling reboot on ' + hosts.length + ' host(s)...' }];
            hosts.forEach(function (h, i) {
              rs.push({ type: 'progress', done: i + 1, total: hosts.length });
              var okR = (i % 7 !== 6);
              rs.push({ type: 'row', Host: h, Success: okR, RebootAt: '12:' + (((15 + i) % 60 < 10) ? '0' : '') + ((15 + i) % 60) + ':00', Detail: okR ? 'reboot scheduled for ~12:15' : 'shutdown command failed (exit 1)' });
            });
            rs.push({ type: 'final', result: { summary: { total: hosts.length } } });
            return rs;
          }
          if (action === 'reboot-abort') {
            var ra = [{ type: 'status', text: 'Cancelling on ' + hosts.length + ' host(s)...' }];
            hosts.forEach(function (h, i) { ra.push({ type: 'progress', done: i + 1, total: hosts.length }); ra.push({ type: 'row', Host: h, Success: true, Detail: (i % 2) ? 'pending reboot cancelled' : 'nothing to cancel (no pending reboot)' }); });
            ra.push({ type: 'final', result: { summary: {} } });
            return ra;
          }
          if (action === 'ping-sweep') {
            window.__wptPing = (window.__wptPing || 0) + 1; var t = window.__wptPing;
            var ps = [{ type: 'status', text: 'Ping sweep ' + hosts.length + ' host(s)...' }];
            hosts.forEach(function (h, i) { ps.push({ type: 'progress', done: i + 1, total: hosts.length }); ps.push({ type: 'row', Host: h, Reachable: (t >= (3 + (i % 2))) }); });
            ps.push({ type: 'final', result: { summary: {} } });
            return ps;
          }
          if (action === 'remote-message') {
            var rm = [{ type: 'status', text: 'Sending warning to ' + hosts.length + ' host(s)...' }];
            hosts.forEach(function (h, i) { rm.push({ type: 'progress', done: i + 1, total: hosts.length }); rm.push({ type: 'row', Host: h, Status: 'Delivered', Detail: 'popup shown' }); });
            rm.push({ type: 'final', result: { summary: {} } });
            return rm;
          }
        }
        if (tool === 'message' && action === 'ping') {
          var ev = [{ type: 'status', text: 'Dispatching ' + hosts.length + ' host(s)...' }], up = 0;
          hosts.forEach(function (h, i) {
            var on = (i % 3 !== 0);
            if (on) up++;
            ev.push({ type: 'progress', done: i + 1, total: hosts.length });
            ev.push({ type: 'row', Host: h, Pingable: on });
          });
          ev.push({ type: 'final', result: { summary: { total: hosts.length, ok: up } } });
          return ev;
        }
        if (tool === 'message' && action === 'send') {
          var ev2 = [{ type: 'status', text: 'Dispatching ' + hosts.length + ' host(s) (16 thread(s))...' }], sent = 0, failed = 0;
          hosts.forEach(function (h, i) {
            var delivered = (i % 4 !== 0);
            if (delivered) sent++; else failed++;
            ev2.push({ type: 'progress', done: i + 1, total: hosts.length });
            if (delivered) ev2.push({ type: 'row', Host: h, Pingable: true, Sessions: 1 + (i % 2), Status: 'Delivered', Detail: 'Delivered to ' + (1 + (i % 2)) + ' session(s)', Diagnostic: 'explorer.ids=[2]' });
            else ev2.push({ type: 'row', Host: h, Pingable: (i % 2 === 0), Sessions: 0, Status: (i % 2 === 0) ? 'Undelivered' : 'Unreachable', Detail: (i % 2 === 0) ? 'No interactive user sessions detected on target' : 'WinRM error: cannot connect', Diagnostic: 'msg*.exit=1' });
          });
          ev2.push({ type: 'status', text: 'Done. ' + sent + ' ok, ' + failed + ' failed of ' + hosts.length + '.' });
          ev2.push({ type: 'final', result: { summary: { total: hosts.length, ok: sent, failed: failed, sent: sent } } });
          return ev2;
        }
        if (tool === 'secureboot' && action === 'enable-secure-boot') {
          var dry = !!(params && (params.dry_run === true || params.dry_run === 'true'));
          var sev = [{ type: 'status', text: 'Starting Secure Boot enable [' + (dry ? 'DRY RUN (preflight only)' : 'LIVE firmware write') + '] on ' + hosts.length + ' host(s)...' }];
          var sok = 0, sskip = 0, sfail = 0, sdry = 0, mfrs = ['Dell', 'HP', 'Lenovo'];
          hosts.forEach(function (h, i) {
            sev.push({ type: 'progress', done: i + 1, total: hosts.length });
            var mfr = mfrs[i % 3];
            if (dry) {
              var reach = (i % 4 !== 0); if (reach) sdry++; else sfail++;
              sev.push({ type: 'row', Host: h, Status: reach ? 'DryRun' : 'Error', Manufacturer: reach ? mfr : '?', Before: 'N/A (Dry Run)', After: 'N/A (Dry Run)', SetResult: 'N/A (Dry Run)', Error: reach ? '' : 'DCOM/CIM unreachable: The RPC server is unavailable' });
            } else {
              var roll = i % 4;
              if (roll === 0) { sfail++; sev.push({ type: 'row', Host: h, Status: 'Error', Manufacturer: mfr, Before: 'Disabled', After: 'Disabled', SetResult: '6', Error: mfr + ' write rejected (Access Denied / bad BIOS password)' }); }
              else if (roll === 1) { sskip++; sev.push({ type: 'row', Host: h, Status: 'Skipped', Manufacturer: mfr, Before: 'Enabled', After: 'Enabled', SetResult: 'Skipped', Error: '' }); }
              else { sok++; sev.push({ type: 'row', Host: h, Status: 'Success', Manufacturer: mfr, Before: 'Disabled', After: 'Enabled (pending reboot)', SetResult: '0', Error: '' }); }
            }
          });
          sev.push({ type: 'status', text: dry ? 'Dry run complete.' : 'Done. ' + sok + ' enabled, ' + sskip + ' skipped, ' + sfail + ' error.' });
          sev.push({ type: 'final', result: { summary: { total: hosts.length, ok: sok, skipped: sskip, failed: sfail, dryRun: dry } } });
          return sev;
        }
        if (tool === 'dhcp') {
          var srv = (params && params.targets) || 'DHCP01';
          if (action === 'connect') {
            var fake = [
              { ScopeId: '10.0.5.0', SubnetMask: '255.255.255.0', Name: 'Floor 3', State: 'Active', Description: 'workstations' },
              { ScopeId: '10.0.6.0', SubnetMask: '255.255.255.0', Name: 'Floor 4', State: 'Active', Description: '' },
              { ScopeId: '10.0.7.0', SubnetMask: '255.255.255.0', Name: 'Lab', State: 'InActive', Description: 'isolated' }
            ];
            var cev = [{ type: 'status', text: 'Connecting to ' + srv + ' ...' }];
            fake.forEach(function (s) { cev.push({ type: 'row', Host: srv, ScopeId: s.ScopeId, SubnetMask: s.SubnetMask, Name: s.Name, State: s.State, Description: s.Description, Module: 'DhcpServer v2.0' }); });
            cev.push({ type: 'final', result: { summary: { total: fake.length } } });
            return cev;
          }
          if (action === 'load') {
            return [{ type: 'row', Host: srv, ScopeId: (params && params.scopeId) || '10.0.5.0', OptionId: (params && params.optionId) || 6, Values: '10.0.0.10, 10.0.0.11', ValueCount: 2, NotSet: false }, { type: 'final', result: { summary: {} } }];
          }
          if (action === 'apply') {
            var nv = String((params && params.newValues) || '').split(/[\s,;]+/).filter(Boolean);
            return [{ type: 'status', text: 'apply running on 1 scope(s) ...' },
              { type: 'row', Host: srv, ScopeId: (params && params.scopeId) || '10.0.5.0', OptionId: (params && params.optionId) || 6, Status: (params && params.dryRun) ? 'NoChange' : 'Changed', BeforeCount: 2, AfterCount: nv.length, BeforeValues: '10.0.0.10, 10.0.0.11', AfterValues: nv.join(', '), Error: '' },
              { type: 'status', text: 'APPLY complete.' }, { type: 'final', result: { summary: {} } }];
          }
          if (/^bulk-/.test(action)) {
            var sids = String((params && params.scopeIds) || '').split(/[\s,;]+/).filter(Boolean);
            var bev = [{ type: 'status', text: action.toUpperCase() + ' running on ' + sids.length + ' scope(s) ...' }];
            sids.forEach(function (sid, i) {
              if (i % 3 === 2) bev.push({ type: 'row', Host: srv, ScopeId: sid, Status: 'NoChange', BeforeCount: 2, AfterCount: 2, BeforeValues: 'a, b', AfterValues: 'a, b', Error: '' });
              else bev.push({ type: 'row', Host: srv, ScopeId: sid, Status: 'Changed', BeforeCount: 2, AfterCount: 3, BeforeValues: 'a, b', AfterValues: 'a, b, c', Error: '' });
            });
            bev.push({ type: 'final', result: { summary: {} } });
            return bev;
          }
        }
        if (tool === 'winupgrade') {
          var dryW = !!(params && (params.dryRun === true || params.dryRun === 'true'));
          var live = (action !== 'ping' && !dryW);   // live runs stream Queued -> phase(s) -> result
          var phases = action === 'installcab' ? ['Copying', 'DISM'] : action === 'pin' ? ['Pinning'] : action === 'unpin' ? ['Unpinning'] : ['Working'];
          var wev = [{ type: 'status', text: "Starting '" + action + "'" + (dryW ? ' [DRY-RUN]' : '') + ' on ' + hosts.length + ' host(s) with ' + ((params && params.threads) || 16) + ' thread(s)...' }];
          wev.push({ type: 'log', level: 'info', text: "[12:00:00] START '" + action + "'" + (dryW ? ' [DRY-RUN]' : '') + ' on ' + hosts.length + ' host(s).' });
          var wok = 0, wfail = 0, wskip = 0;
          if (live) hosts.forEach(function (h) { wev.push({ type: 'row', Host: h, Ping: '', Status: 'Queued', Detail: 'waiting for a runspace...' }); });
          hosts.forEach(function (h, i) {
            var roll = i % 5;
            if (action === 'ping') {
              wev.push({ type: 'progress', done: i + 1, total: hosts.length });
              if (roll === 3) { wfail++; wev.push({ type: 'row', Host: h, Ping: 'Unreachable', Status: 'Offline' }); } else { wok++; wev.push({ type: 'row', Host: h, Ping: (12 + i) + ' ms', Status: 'Online' }); }
              return;
            }
            if (dryW) {
              wok++; wev.push({ type: 'progress', done: i + 1, total: hosts.length });
              wev.push({ type: 'row', Host: h, Ping: (12 + i) + ' ms', Status: 'DRY-RUN', Detail: action === 'pin' ? 'Would set TargetReleaseVersion' : action === 'unpin' ? 'Would remove the policy' : 'Would copy + DISM /Add-Package the CAB' });
              return;
            }
            // live: stream each phase row (Copying / DISM / ...) then the final result (same Host key)
            phases.forEach(function (ph) { wev.push({ type: 'row', Host: h, Ping: (12 + i) + ' ms', Status: ph, Detail: ph + ' on the target...' }); });
            wev.push({ type: 'progress', done: i + 1, total: hosts.length });
            if (roll === 3) { wfail++; wev.push({ type: 'row', Host: h, Ping: 'Unreachable', Status: 'Offline', Detail: 'Unreachable (ICMP)' }); }
            else if (roll === 4) { wfail++; wev.push({ type: 'row', Host: h, Ping: (12 + i) + ' ms', Status: 'FAILED', Detail: 'WinRM error: cannot connect' }); }
